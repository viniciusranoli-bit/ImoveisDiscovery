# Sobe a aplicação e um PostgreSQL próprio.
#
#   npm run docker:up      (recomendado — sincroniza backend/.env → .env na raiz)
#   npm run docker:down
#
# Compose só lê .env na raiz para POSTGRES_*; o app usa backend/.env (AUTH_SECRET, APIs).
# Sem npm: npx tsx scripts/sync-docker-env.ts && docker compose up --build
#
# O serviço app sobrescreve DB_HOST=db. Para Postgres externo: DB_HOST=host.docker.internal e remova db.

name: aluguel-discovery

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-alugueldiscovery}
      POSTGRES_USER: ${DB_USER:-aluguel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aluguel_dev_docker}
    volumes:
      - aluguel_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - backend/.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_SSL: "false"
      PLAYWRIGHT_HEADLESS: "true"
      PLAYWRIGHT_CHANNEL: chromium
      PLAYWRIGHT_NO_SANDBOX: "true"
    depends_on:
      db:
        condition: service_healthy
    shm_size: 1gb
    init: true
    restart: unless-stopped

volumes:
  aluguel_pg:
