# Homologação: frontend 3000 + backend 3001. Dev Cursor: npm run dev (3005 + 3006).

name: aluguel-discovery

include:
  - path: ./backend/docker-compose.yml
  - path: ./frontend/docker-compose.yml

services:
  backend:
    environment:
      DB_HOST: host.docker.internal
      API_PORT: "3001"
      FRONTEND_ORIGIN: http://localhost:3000
      BACKEND_IN_DOCKER: "true"
      PROJECT_ROOT: /workspace
      EVOLUTION_API_URL: http://host.docker.internal:8080
  frontend:
    build:
      args:
        API_URL: http://backend:3001
    environment:
      API_URL: http://backend:3001
    depends_on:
      backend:
        condition: service_healthy
