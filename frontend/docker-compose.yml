# Homologação: UI publicada na 3000. Dev Cursor usa npm run dev na 3005 (API 3006).
# Stack: npm run docker:up — API interna http://backend:3001

name: aluguel-frontend

services:
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        API_URL: ${API_URL:-http://host.docker.internal:3001}
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      API_URL: ${API_URL:-http://host.docker.internal:3001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
