services:
  evolution-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_dev
      POSTGRES_DB: evolution
    volumes:
      - evolution_pg:/var/lib/postgresql/data

  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.0
    restart: unless-stopped
    depends_on:
      - evolution-postgres
      - evolution-redis
    # 8080:8080 (não só 127.0.0.1) para o backend em Docker alcançar via host.docker.internal.
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  evolution_pg:
  evolution_instances:
